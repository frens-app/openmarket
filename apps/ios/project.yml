name: OpenMarket
options:
  bundleIdPrefix: lol.frens
  deploymentTarget:
    iOS: "17.0"
targets:
  OpenMarket:
    type: application
    platform: iOS
    # `Resources` holds the asset catalog and nothing else so far. Listed
    # separately rather than folded into `Sources`, so it stays obvious that one
    # of these is compiled and the other is copied.
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.frens.openmarket
        PRODUCT_NAME: OpenMarket
        # The two version strings, and they belong here for the same reason the
        # team below does: this file is the source of truth, and anything typed
        # into Xcode's General pane lives only in the generated .xcodeproj —
        # which is gitignored and rewritten wholesale by `xcodegen generate`.
        # Set there, these survive until the next regenerate and are never
        # committed, which is the worst of both: it works locally right up until
        # it silently doesn't.
        #
        # `GENERATE_INFOPLIST_FILE` turns them into the two keys Apple actually
        # reads — MARKETING_VERSION is CFBundleShortVersionString, the version a
        # user sees, and CURRENT_PROJECT_VERSION is CFBundleVersion, the build
        # number that has to increase with every upload of a given version.
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        # The name under the icon, which is the only one a user reads. Kept
        # separate from PRODUCT_NAME so the bundle and scheme can stay a single
        # token while the app presents as two words.
        INFOPLIST_KEY_CFBundleDisplayName: "Open Market"
        # Named explicitly because nothing infers it: without this the build
        # succeeds, ships the default blank icon, and says nothing about it.
        # A single 1024×1024 in the catalog is the whole set — iOS downsamples
        # the rest, and the artwork must have no alpha channel or App Store
        # validation rejects the build (`Resources/Assets.xcassets`).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Used to centre your search on your area, and to estimate how long it takes to reach a listing."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        # Signing lives here, not in Xcode.
        #
        # This project is generated: `xcodegen generate` rewrites the .xcodeproj
        # wholesale from this file, so anything set through Xcode's Signing &
        # Capabilities pane survives exactly until the next regenerate. A team
        # set that way was silently lost once already, and took the bundle
        # identifier with it — which is worse than it sounds, because the build
        # still succeeds and installs, just under a different app.
        #
        # Friendly Labs Inc.
        DEVELOPMENT_TEAM: 6M3V5JF982
        CODE_SIGN_STYLE: Automatic
        # Spelled out because xcodegen's default is the legacy "iPhone
        # Developer", which no longer names anything: the certificate in the
        # keychain is an "Apple Development" one, and pinning the old string
        # leaves the build looking for an identity that doesn't exist.
        CODE_SIGN_IDENTITY: "Apple Development"
        # On, and said out loud rather than left to the default.
        #
        # This was pinned to NO so simulator builds could run unsigned, and that
        # is precisely what produced "Sign the executable with a valid
        # certificate and provisioning profile": the build happily emits an
        # unsigned binary and then fails at the step that needs a signed one.
        # Nothing was wrong with the certificate or the profiles.
        #
        # YES is safe for both destinations — a device build signs against the
        # team above, and a simulator build signs ad-hoc, which is what the
        # simulator wants anyway.
        CODE_SIGNING_ALLOWED: "YES"
        SWIFT_VERSION: "5.0"
