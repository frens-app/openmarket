name: OpenMarket
options:
  bundleIdPrefix: lol.frens
  deploymentTarget:
    iOS: "17.0"

# Everything that differs between environments — bundle identifier, display
# name, API endpoint, APNs environment, version numbers — lives in these files
# and nowhere else. See Configurations/Debug.xcconfig for why they are xcconfigs
# rather than `#if DEBUG` branches.
#
# Debug and Release install side by side: different bundle identifiers mean
# different apps, so a dev build cannot overwrite the App Store one, and the two
# do not share a keychain, a container, or UserDefaults.
configFiles:
  Debug: Configurations/Debug.xcconfig
  Release: Configurations/Release.xcconfig
# The two above are the only ones Xcode would otherwise show, because they are
# the only ones the *project* references. `Debug.local.xcconfig` is pulled in a
# level lower — by `#include?` inside Debug.xcconfig, which the build system
# resolves off disk — so it works while being invisible in the navigator, which
# reads as a missing file rather than a deliberate one.
#
# Listing the directory here puts all of them in the navigator, editable in
# place. It adds file references only: nothing is compiled or copied, and on a
# machine with no local override the file simply isn't listed.
fileGroups:
  - Configurations
# Local, not remote: the contents are generated from /protos by `buf generate`,
# so the package is only ever as current as the last regenerate — pinning it to
# a version would let the Swift types drift from the Go ones, which is the exact
# failure the shared schema exists to prevent.
packages:
  OpenMarketProtos:
    path: Packages/OpenMarketProtos
  # The only remote dependency declared here, and pinned exactly — same rule
  # `Packages/OpenMarketProtos/Package.swift` states for its three, and for the
  # same reason: with a range, two checkouts of this commit can resolve
  # different versions and the one that breaks is whichever machine resolved
  # later. Bumping it is a visible one-line commit, which is the right shape
  # for something that ships inside a signed app.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.69.5

targets:
  OpenMarket:
    type: application
    platform: iOS
    # `Resources` holds the asset catalog and nothing else so far. Listed
    # separately rather than folded into `Sources`, so it stays obvious that one
    # of these is compiled and the other is copied.
    sources: [Sources, Resources]
    dependencies:
      - package: OpenMarketProtos
      - package: PostHog
    # Push, declared here for the same reason signing is: this file is the
    # source of truth and `xcodegen generate` rewrites the .xcodeproj wholesale,
    # so a capability added through Xcode's Signing & Capabilities pane survives
    # exactly until the next regenerate.
    #
    # The value is a build setting, so Debug signs `development` and Release
    # signs `production` from one file. **Both** App IDs need the Push
    # Notifications capability enabled in the developer portal — without it the
    # entitlement is present, the build succeeds, and APNs simply refuses to
    # issue a token at runtime (`PushRegistrar.didFailToRegister`).
    entitlements:
      path: OpenMarket.entitlements
      properties:
        aps-environment: $(APNS_ENVIRONMENT)

    # A real Info.plist, because the endpoint has to be readable at *runtime*.
    #
    # `GENERATE_INFOPLIST_FILE` can only inject keys Apple already knows about,
    # via INFOPLIST_KEY_*, so there is no way to get a custom API_HOSTNAME in
    # that way. Generating the file here keeps every key in one visible list and
    # lets the build substitute the $(…) values per configuration.
    info:
      path: OpenMarket.Info.plist
      properties:
        CFBundleDisplayName: $(DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Read by `API.baseURL`. Two keys rather than one URL because xcconfig
        # treats `//` as a comment — see Configurations/Debug.xcconfig.
        API_SCHEME: $(API_SCHEME)
        API_HOSTNAME: $(API_HOSTNAME)
        # Read by `Analytics`. Debug and Release carry different PostHog
        # projects; an empty key switches analytics off.
        #
        # The host is a bare hostname for the same reason `API_HOSTNAME` is:
        # xcconfig treats `//` as a comment, so a full URL would arrive here
        # as `https:`.
        POSTHOG_API_KEY: $(POSTHOG_API_KEY)
        POSTHOG_HOSTNAME: $(POSTHOG_HOSTNAME)
        POSTHOG_CAPTURE_EVENTS: $(POSTHOG_CAPTURE_EVENTS)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "Used to centre your search on your area, and to estimate how long it takes to reach a listing."
        # Price Check's camera button. There is deliberately no
        # NSPhotoLibraryUsageDescription beside it: the library is read through
        # `PhotosPicker`, which runs out of process and hands back only what the
        # user picked, so it needs no permission and asking for one would be
        # requesting access this app never has.
        NSCameraUsageDescription: "Take a photo of what you're selling, so Price Check can identify it."
        # No NSAppTransportSecurity block, deliberately. A per-configuration
        # ATS exception cannot be expressed here: plist variable substitution
        # produces strings, and `NSAllowsLocalNetworking` is specified as a
        # Boolean — so `$(…)` yields the string "YES", which may simply be
        # ignored. A security exception that might not work is worse than none,
        # and hardcoding `true` would ship it in Release.
        #
        # It costs nothing today: ATS exempts loopback, so the Simulator talks
        # to `make dev` over plain HTTP either way. A physical device needs an
        # https host — see Configurations/Debug.example.xcconfig.
    settings:
      base:
        # PRODUCT_BUNDLE_IDENTIFIER, DISPLAY_NAME, MARKETING_VERSION,
        # CURRENT_PROJECT_VERSION, API_SCHEME, API_HOSTNAME and
        # APNS_ENVIRONMENT all come from the xcconfigs above. Setting any of
        # them here would silently win over the file, since a target-level
        # setting beats a configuration file.
        PRODUCT_NAME: OpenMarket
        # Named explicitly because nothing infers it: without this the build
        # succeeds, ships the default blank icon, and says nothing about it.
        # A single 1024×1024 in the catalog is the whole set — iOS downsamples
        # the rest, and the artwork must have no alpha channel or App Store
        # validation rejects the build (`Resources/Assets.xcassets`).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Signing lives here, not in Xcode.
        #
        # This project is generated: `xcodegen generate` rewrites the .xcodeproj
        # wholesale from this file, so anything set through Xcode's Signing &
        # Capabilities pane survives exactly until the next regenerate. A team
        # set that way was silently lost once already, and took the bundle
        # identifier with it — which is worse than it sounds, because the build
        # still succeeds and installs, just under a different app.
        #
        # Friendly Labs Inc.
        DEVELOPMENT_TEAM: 6M3V5JF982
        CODE_SIGN_STYLE: Automatic
        # Spelled out because xcodegen's default is the legacy "iPhone
        # Developer", which no longer names anything: the certificate in the
        # keychain is an "Apple Development" one, and pinning the old string
        # leaves the build looking for an identity that doesn't exist.
        CODE_SIGN_IDENTITY: "Apple Development"
        # On, and said out loud rather than left to the default.
        #
        # This was pinned to NO so simulator builds could run unsigned, and that
        # is precisely what produced "Sign the executable with a valid
        # certificate and provisioning profile": the build happily emits an
        # unsigned binary and then fails at the step that needs a signed one.
        # Nothing was wrong with the certificate or the profiles.
        #
        # YES is safe for both destinations — a device build signs against the
        # team above, and a simulator build signs ad-hoc, which is what the
        # simulator wants anyway.
        CODE_SIGNING_ALLOWED: "YES"
        SWIFT_VERSION: "5.0"

  OpenMarketTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: OpenMarket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lol.frens.openmarket.tests
        GENERATE_INFOPLIST_FILE: "YES"
