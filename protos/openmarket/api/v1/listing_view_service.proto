syntax = "proto3";
package openmarket.api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "openmarket/api/v1/saved_listing_service.proto";

// Describes the fresh detail read, not older card fields retained in snapshot.
enum ListingViewSource {
  LISTING_VIEW_SOURCE_UNSPECIFIED = 0;
  LISTING_VIEW_SOURCE_ANONYMOUS_GRAPHQL = 1;
  LISTING_VIEW_SOURCE_AUTHENTICATED_GRAPHQL = 2;
  LISTING_VIEW_SOURCE_ANONYMOUS_DESKTOP_PAGE = 3;
  LISTING_VIEW_SOURCE_AUTHENTICATED_DESKTOP_PAGE = 4;
  LISTING_VIEW_SOURCE_ANONYMOUS_MOBILE_PAGE = 5;
  LISTING_VIEW_SOURCE_AUTHENTICATED_MOBILE_PAGE = 6;
}

service ListingViewService {
  rpc SubmitListingView(SubmitListingViewRequest) returns (SubmitListingViewResponse);
}

message SubmitListingViewRequest {
  string facebook_listing_id = 1 [(buf.validate.field).string.pattern = "^[0-9]{1,64}$"];
  google.protobuf.Timestamp viewed_at = 2 [(buf.validate.field).required = true];
  // Absent for a failed detail fetch (or an older client's initial upload).
  SavedListingSnapshot snapshot = 3;
  ListingViewSource source = 4 [(buf.validate.field).enum.defined_only = true];
  // The app entry point, independent of the Facebook detail extraction source.
  // Send once per open, after the fetch attempt. Older clients omit this field
  // and do not contribute to click counts because they upload each open twice.
  optional string referrer = 5 [(buf.validate.field).string = {
    in: ["discover", "search", "ai_search", "listing_alerts", "recently_viewed",
         "saved", "price_check_evidence", "listing_price_check", "seller_profile"]
  }];
}
message SubmitListingViewResponse {}
