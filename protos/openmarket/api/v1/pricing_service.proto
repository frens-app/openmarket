syntax = "proto3";

package openmarket.api.v1;

import "buf/validate/validate.proto";

// Pricing is two calls with the phone's own work in between, and that shape is
// forced rather than chosen.
//
// The market search runs in a WKWebView against the user's own Facebook session
// (docs/decision-desktop-primary.md). The server has no cookie jar and cannot
// get one, so it cannot fetch a single comparable. What it can do is the two
// things the phone can't: reach a vision model, and remember what happened.
//
//   IdentifyItem  photo + description        -> what this is, what to search
//   (device)      ComparableSearch           -> the market, on the phone
//   PriceItem     comparables + the numbers  -> a price, a title, a description
//
// The order is also the fix for the worst failure the on-device writer had: it
// took the item's identity from the comparables, titling a stroller "IKEA Malm
// 4 Drawer Dresser White" on three runs out of three (README, "The on-device
// writer"). Here the item is named from the photo, before any comparable
// exists — so that particular poisoning is unreachable rather than prompted
// against.

// What the seller is holding, as the model reads it.
message IdentifyItemRequest {
  // The item, in the seller's words. Not a query — people describe what they
  // are selling, and `SearchTerm` exists because that is never phrased as one.
  string description = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {
      min_len: 3
      max_len: 2000
    }
  ];

  // JPEG, downscaled by the client before it is sent.
  //
  // **Repeated, capped at one.** One photo is all the app offers today and all
  // the server will accept — but a seller with a scratched tabletop and an
  // intact drawer front obviously wants to send both, and raising this cap
  // later must not cost an App Store release. `repeated` now makes that a
  // one-line change to `max_items`; `optional bytes photo` now would make it a
  // new field number and a compatibility shim.
  //
  // When the cap does rise, the prompt has to say the photos are the same item
  // from different angles. Left implicit, a model describes them as separate
  // items — the same class of failure as taking the identity from the comps.
  //
  // Optional in practice: an empty list runs on the description alone, which is
  // roughly what the tool did before it could see anything. That keeps a failed
  // or skipped photo pick a degradation rather than a dead end.
  repeated bytes photos = 2 [
    (buf.validate.field).repeated = {
      max_items: 1
      items: {
        bytes: {max_len: 4194304}
      }
    }
  ];
}

// Facebook's own condition values, so a guess here can be handed straight to
// the search filter later (`SearchQuery.Condition`).
enum ItemCondition {
  ITEM_CONDITION_UNSPECIFIED = 0;
  ITEM_CONDITION_NEW = 1;
  ITEM_CONDITION_USED_LIKE_NEW = 2;
  ITEM_CONDITION_USED_GOOD = 3;
  ITEM_CONDITION_USED_FAIR = 4;
}

message IdentifyItemResponse {
  // Threads the whole run together: the client carries it into PriceItem, into
  // feedback, and into the copy report. Issued here because the row is written
  // here — a run that dies before it finds a market is still a row worth having.
  string price_check_id = 1;

  // What the thing is, in as few words as identify it. Shown in the transcript,
  // because a price guide is only as good as what it thought it was pricing,
  // and the user is the one who can see it is wrong.
  string identified_name = 2;

  // What to search Facebook for. One or two — the second is a fallback phrasing,
  // not a second item.
  //
  // Two is the cap because each one costs up to two page loads (active and
  // sold), and `RequestPacer` is a shared actor: a third query spends the
  // browse tab's request budget to hedge a query that was probably fine.
  repeated string search_queries = 3;

  // A guess from the photo, and only ever a guess. Never used to narrow the
  // comparable search — condition words narrow the search without narrowing the
  // market, which is why `SearchTerm` strips them.
  ItemCondition condition = 4;

  // Distinguishing facts the model could see or was told: "six drawers",
  // "original box", "left armrest torn". Feeds the listing description, and
  // exists so that description is built from observations rather than invented
  // — a small model asked for richer prose wrote "a few minor scratches on the
  // frame" about a bike whose seller mentioned none.
  repeated string key_attributes = 5;
}

// One comparable, as the phone read it off a card.
message Comparable {
  string title = 1;

  // Minor units. Absent when the card had no price we could read, which is
  // ordinary — and different from zero, which means Free. Free items are
  // excluded from the arithmetic upstream (seven of twelve sold couches in San
  // Francisco were free), but they are still sent, because "most of these went
  // for nothing" is a fact about the market.
  optional int64 price_minor = 2;

  // Seller-marked. Means "no longer for sale", never "sold for this".
  bool is_sold = 3;

  // How long it had been listed. On a sold card this is the useful one: it is
  // an upper bound on how long it took to sell, because Facebook publishes no
  // sale date — `creation_time` is the only time field on a listing.
  optional int32 days_listed = 4;

  optional string city = 5;
}

// The market reduced to numbers, computed by `PriceGuide` on the device.
//
// **Sent because the model must not derive them.** Asked to justify its own
// figure against fourteen prices it had just been shown, the on-device model
// wrote "you are asking CA$20 more than the median price of CA$80" — the median
// was CA$77 and the gap was CA$33, two wrong numbers in one confident sentence,
// printed under the one figure a person acts on. Arithmetic about a sample
// belongs to whoever computed the sample.
message MarketStats {
  // How many comparables carried a usable price. Not the number sent: a guide
  // built from four of fifteen cards is a different claim from one built from
  // all fifteen.
  int32 priced_count = 1;

  int64 median_minor = 2;
  int64 lowest_minor = 3;
  int64 highest_minor = 4;

  // The interquartile band. Absent below four samples, where quartiles of three
  // numbers are just the three numbers.
  optional int64 lower_quartile_minor = 5;
  optional int64 upper_quartile_minor = 6;

  // The symbol the cards were written in — "$", "CA$", "£" — voted on across
  // the sample. Not an ISO code, because nothing here learns one. A price
  // rendered "$80" beside a strip of CA$ comparables is wrong by about a third.
  string currency_symbol = 7;

  // What sold, and how fast. Empty is an ordinary outcome, not a failure.
  //
  // This half can support "this price worked" and can never support "this price
  // is too high" — it is filtered on having sold, so the things that failed to
  // sell at a price are exactly the ones missing. The prompt has to say so, or
  // a model handed sold prices treats them as a target.
  int32 sold_count = 8;
  optional int32 median_days_to_sell = 9;
}

message PriceItemRequest {
  string price_check_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Which of the returned queries actually produced this market. Recorded so a
  // bad identification and a bad market are distinguishable afterwards.
  string search_query_used = 2;

  // Capped well above the ~15 a search page returns, so the ceiling is a bound
  // on abuse rather than a limit the feature can reach.
  repeated Comparable comparables = 3 [(buf.validate.field).repeated.max_items = 100];

  MarketStats stats = 4 [(buf.validate.field).required = true];

  // Where, in the words the user sees — "San Francisco Bay Area". Context for
  // the listing copy, not a filter.
  string market_name = 5;
}

message PriceItemResponse {
  // Minor units, and a judgement rather than a calculation: the model picks a
  // point given the band, the item, and what sold. The client clamps it to the
  // observed range before showing it, because a recommendation outside the
  // evidence is not a bolder opinion about the market, it is a number with
  // nothing behind it.
  int64 recommended_price_minor = 1;

  // A listing title and body, ready to paste into Facebook.
  string title = 2;
  string description = 3;

  // Deliberately no rationale field.
  //
  // The sentence under the price is `PriceGuide.explanation` plus
  // `SoldSignal.priceNote`, written in Swift from the numbers it just computed
  // and true by construction. A second, model-written "why this price" would be
  // two voices explaining one figure, and only one of them can be checked.
}

message SubmitPriceCheckFeedbackRequest {
  string price_check_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Answered, either way. There is no third value here because the third state
  // is not calling this — which is why the column is nullable and why the screen
  // shows two buttons rather than one checkbox: a checkbox cannot tell "no"
  // from "didn't answer", and those are different findings.
  bool helpful = 2;
}

message SubmitPriceCheckFeedbackResponse {}

message RecordPriceCopiedRequest {
  string price_check_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];
}

message RecordPriceCopiedResponse {}

service PricingService {
  rpc IdentifyItem(IdentifyItemRequest) returns (IdentifyItemResponse);
  rpc PriceItem(PriceItemRequest) returns (PriceItemResponse);

  // The asked question.
  rpc SubmitPriceCheckFeedback(SubmitPriceCheckFeedbackRequest) returns (SubmitPriceCheckFeedbackResponse);

  // The unasked one, and the better of the two. Copying the price is what
  // somebody does immediately before pasting it into Facebook's price box: it
  // is captured on nearly every successful run, where a prompt is answered by
  // the minority who feel strongly enough to stop and tap — which skews
  // negative. Idempotent; the first copy keeps the timestamp.
  rpc RecordPriceCopied(RecordPriceCopiedRequest) returns (RecordPriceCopiedResponse);
}
