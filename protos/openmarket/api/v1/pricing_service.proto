syntax = "proto3";

package openmarket.api.v1;

import "buf/validate/validate.proto";

// **One model call, and then arithmetic.**
//
//   IdentifyItem        photo + description -> what this is, what to search,
//                                              and the listing to paste
//   (device)            ComparableSearch    -> the market, in a WKWebView
//   (device)            PriceGuide          -> the price, from those numbers
//   CompletePriceCheck  what it found       -> the row
//
// Two things force this shape. The market search cannot leave the phone: it
// runs against the user's own Facebook session (docs/decision-desktop-primary.md)
// and the server has no cookie jar to borrow. And the price is a median, which
// is arithmetic — the one thing a language model is measurably bad at and Swift
// is exact at.
//
// So the model does the part it is good at, once: look at a photograph, say
// what the object is, and write two paragraphs about it. Everything numeric
// belongs to `PriceGuide`.
//
// There used to be a second call that picked the price and wrote the copy with
// the comparables in front of it. It was removed for two reasons, in this
// order of importance. **It could see the comparables**, which is the setup for
// the worst failure this feature has on record — a model taking the item's
// identity from the market, titling a stroller "IKEA Malm 4 Drawer Dresser
// White" on three runs of three (README, "The on-device writer"). And on runs
// where the seller wrote nothing about condition it returned the median, which
// Swift already had: 1,350 tokens and four seconds to reproduce a number that
// was sitting in a variable.

// What the seller is holding, as the model reads it.
message IdentifyItemRequest {
  // **Either input will do, but not neither.** A photo alone identifies an item
  // perfectly well — that is what a vision model is for — and demanding a
  // sentence to go with it turns "point your camera at the thing" into
  // homework. Words alone work too; that is what this tool did before it could
  // see anything.
  //
  // The pair is checked here rather than on `description` because the rule is
  // about the request, not the field: neither input is individually required
  // and exactly one of them being absent is fine. A `required` on either one
  // would be a lie in half the valid cases.
  option (buf.validate.message).cel = {
    id: "identify_item.needs_an_item"
    message: "send a description of at least 3 characters, a photo, or both"
    expression: "size(this.description) >= 3 || size(this.photos) > 0"
  };

  // The item, in the seller's words. Not a query — people describe what they
  // are selling, and `SearchTerm` exists because that is never phrased as one.
  //
  // No `min_len`: an empty description is a valid request when a photo carries
  // it. The three-character floor lives in the rule above, where it only
  // applies to the case that needs it.
  string description = 1 [(buf.validate.field).string = {max_len: 2000}];

  // JPEG, downscaled by the client before it is sent.
  //
  // **Capped at three**, up from one — and the cap being a number here rather
  // than a field shape is exactly why that was a one-line change. `optional
  // bytes photo` would have needed a new field number and a compatibility shim.
  //
  // Three because a seller with a scratched tabletop, an intact drawer front
  // and a label on the back wants all three, and because every photo is input
  // tokens on the only call this feature makes — the fourth picture of a
  // dresser tells a model very little the first three did not.
  //
  // **The prompt says they are one item from several angles**, which the
  // previous version of this comment predicted would be needed. Left implicit,
  // a model describes them as separate items — the same class of failure as
  // taking the identity from the comparables.
  //
  // Optional, as long as there are words: an empty list runs on the description
  // alone, which is roughly what the tool did before it could see anything.
  // That keeps a failed or skipped photo pick a degradation rather than a dead
  // end. See the message rule above for the one combination that is refused.
  repeated bytes photos = 2 [
    (buf.validate.field).repeated = {
      max_items: 3
      items: {
        bytes: {max_len: 4194304}
      }
    }
  ];
}

message IdentifyItemResponse {
  // Threads the whole run together: the client carries it into
  // CompletePriceCheck, into feedback, and into the copy report. Issued here
  // because the row is written here — a run that dies before it finds a market
  // is still a row worth having.
  string price_check_id = 1;

  // What the thing is, in as few words as identify it. Shown in the transcript,
  // because a price guide is only as good as what it thought it was pricing,
  // and the user is the one who can see it is wrong.
  string identified_name = 2;

  // What to search Facebook for. One or two — the second is a fallback phrasing,
  // not a second item.
  //
  // Two is the cap because each one costs up to two page loads (active and
  // sold), and `RequestPacer` is a shared actor: a third query spends the
  // browse tab's request budget to hedge a query that was probably fine.
  repeated string search_queries = 3;

  // Field 4 was `ItemCondition condition`. Removed with the second model call:
  // nothing consumed it. It was never allowed to narrow the search (condition
  // words narrow the search without narrowing the market), and the only other
  // reader was the pricing prompt that no longer exists. A guess nobody acts on
  // is a guess worth not making.
  reserved 4;
  reserved "condition";

  // Distinguishing facts the model could see or was told: "six drawers",
  // "original box", "left armrest torn". These are the working behind the
  // description below — kept separate from it so the observations can be
  // checked against the prose that was built from them.
  repeated string key_attributes = 5;

  // **The listing, written here.** This is the whole of the model's output
  // besides the identification, and it is produced before a single comparable
  // exists.
  //
  // That ordering is not a saving, it is the fix. The failure this feature is
  // built around is a model taking the item's identity from the comparables —
  // a stroller titled "IKEA Malm 4 Drawer Dresser White", three runs of three.
  // Writing the copy in the call that cannot see the market makes that
  // unreachable, where the previous shape spent a prompt rule arguing with it.
  //
  // Empty is possible and survivable: the price does not depend on these, and a
  // run that produced numbers but no prose is still a useful run.
  string listing_title = 6;
  string listing_description = 7;
}

// The market reduced to numbers, computed by `PriceGuide` on the device.
//
// **No model has ever seen these and none ever will.** They used to be sent to
// one, because it could not be trusted to derive them: asked to justify its own
// figure against fourteen prices it had just been shown, the on-device model
// wrote "you are asking CA$20 more than the median price of CA$80" — the median
// was CA$77 and the gap was CA$33, two wrong numbers in one confident sentence,
// printed under the one figure a person acts on.
//
// The price is now these numbers directly, so that whole class of failure is
// gone rather than guarded. What arrives here is a record of what the device
// found and what it therefore recommended.
message MarketStats {
  // How many comparables carried a usable price. Not the number sent: a guide
  // built from four of fifteen cards is a different claim from one built from
  // all fifteen.
  int32 priced_count = 1;

  int64 median_minor = 2;
  int64 lowest_minor = 3;
  int64 highest_minor = 4;

  // The interquartile band. Absent below four samples, where quartiles of three
  // numbers are just the three numbers.
  optional int64 lower_quartile_minor = 5;
  optional int64 upper_quartile_minor = 6;

  // The symbol the cards were written in — "$", "CA$", "£" — voted on across
  // the sample. Not an ISO code, because nothing here learns one. A price
  // rendered "$80" beside a strip of CA$ comparables is wrong by about a third.
  string currency_symbol = 7;

  // What sold, and how fast. Empty is an ordinary outcome, not a failure.
  //
  // This half can support "this price worked" and can never support "this price
  // is too high" — it is filtered on having sold, so the things that failed to
  // sell at a price are exactly the ones missing. The prompt has to say so, or
  // a model handed sold prices treats them as a target.
  int32 sold_count = 8;
  optional int32 median_days_to_sell = 9;
}

// What the device found, and what it therefore recommended.
//
// **This call reaches no model.** It closes the row, and that is all — the
// price it carries was computed by `PriceGuide` on the phone, from the
// comparables the phone scraped, and the server's job is to write it down.
//
// It stays a round trip anyway, because the row is the point: without it a
// check that found a market is indistinguishable from one that died at the
// identify call, and "how often does the search come back empty" is the first
// question anyone will ask of this feature.
message CompletePriceCheckRequest {
  string price_check_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Which of the returned queries actually produced this market. Recorded so a
  // bad identification and a bad market are distinguishable afterwards.
  string search_query_used = 2;

  // How many comparables the search returned. A count, not the listings:
  // nothing here stores them and nothing reads them any more, so sending a
  // hundred cards for the server to drop on the floor would be Facebook's data
  // leaving the phone for no reason at all. `MarketStats.priced_count` is the
  // subset that carried a usable price, and the pair is the interesting part.
  int32 comps_found = 3;

  MarketStats stats = 4 [(buf.validate.field).required = true];

  // Field 5 was `market_name`, which existed to give the pricing prompt some
  // context for the copy. There is no pricing prompt. Reserved rather than
  // reused, even though nothing has shipped: the next field number is free and
  // a recycled one is a trap for whoever is holding a stale client.
  reserved 5;
  reserved "market_name";

  // Minor units. Derived, not decided: the median of the asking prices, which
  // is what the screen falls back to and what the model was being steered
  // towards anyway. It arrives already inside the observed range by
  // construction, which is why nothing clamps it now.
  int64 recommended_price_minor = 6;
}

message CompletePriceCheckResponse {}

message SubmitPriceCheckFeedbackRequest {
  string price_check_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Answered, either way. There is no third value here because the third state
  // is not calling this — which is why the column is nullable and why the screen
  // shows two buttons rather than one checkbox: a checkbox cannot tell "no"
  // from "didn't answer", and those are different findings.
  bool helpful = 2;
}

message SubmitPriceCheckFeedbackResponse {}

// What the seller took away, which is not necessarily what was offered.
//
// Everything on the result screen is now editable — the price has a stepper,
// the title and the description are text fields — so for each of them there are
// two facts: what was generated, and what was actually used. The generated
// side is already stored (`recommended_price_minor`, `listing_title`,
// `listing_description`); this call carries the other side.
//
// **The gap between the pair is the only real measure of quality this feature
// has.** "Helpful? yes" is an opinion from the minority who stop to tap;
// "every seller rewrites the title and moves the price up 20%" is behaviour,
// from everybody, and it says exactly what to fix. Overwriting the generated
// values with the edits — the obvious single-column design — would erase the
// comparison that makes either number worth having.
//
// Every field is optional and only what was copied is sent, so three copy
// buttons are three calls that each say one true thing.
message RecordPriceCheckCopyRequest {
  string price_check_id = 1 [
    (buf.validate.field).required = true,
    (buf.validate.field).string.uuid = true
  ];

  // Minor units. Present only on a price copy, which is also what sets
  // `price_copied` — the boolean has always meant "took the number", and a
  // title copy is not that.
  optional int64 copied_price_minor = 2;

  // The listing as it was copied. Sent whether or not it differs from what was
  // generated: "they read it and used it unchanged" is a result, and inferring
  // it from an absent field would confuse it with "they never copied at all".
  optional string copied_listing_title = 3 [(buf.validate.field).string.max_len = 200];
  optional string copied_listing_description = 4 [(buf.validate.field).string.max_len = 2400];
}

message RecordPriceCheckCopyResponse {}

// The runs this user has already done, newest first.
//
// The row was always being written — see `CreatePriceCheck`, which runs before
// the model is called precisely so a run that dies is still a row. This reads
// them back, which is the whole of what "recent checks" needs: no new table, no
// new column, and nothing kept on the device.
message ListPriceChecksRequest {
  // Clamped server-side as well. This is a list somebody scrolls past on the
  // way to typing, not a data export.
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 0, lte: 50}];
}

// One past run, as much of it as survives.
//
// **The comparables are not here, and this is the honest shape rather than a
// gap.** Nothing has ever stored them: a card that was live during the run is a
// 404 a week later, and a strip of dead listings under a price is worse than no
// strip (migration 00006). So a past check can say what it decided and what it
// decided from — a count and a search term — and cannot show its working. The
// listing copy, which is the part somebody comes back for, survives in full.
message PriceCheckSummary {
  string price_check_id = 1;

  // RFC 3339. A string rather than a Timestamp because that is what
  // `Viewer.created_at` already is, and one timestamp convention beats two.
  string created_at = 2;

  // What the model called it, and what the seller called it. Both, because
  // either can be the useful one: the identification is usually the better
  // label, and the description is what to show when the run died before there
  // was an identification.
  string identified_name = 3;
  string description = 4;

  // Absent on a run that never found a market — which is a real outcome and
  // stays in the list, since "I checked that dresser and it found nothing" is
  // something a person remembers doing.
  optional int64 recommended_price_minor = 5;
  string currency_symbol = 6;

  int32 comps_found = 7;
  int32 sold_found = 8;
  string search_query_used = 9;

  // **What the seller ended up with, not what was generated**, where the two
  // differ: the server prefers the copied columns and falls back to the
  // generated ones. Both are still stored separately — the gap between them is
  // the quality signal this feature is built on — but a history screen is the
  // user's record, not ours, and handing back the version they rewrote as
  // though they had not is the wrong side of that distinction.
  string listing_title = 10;
  string listing_description = 11;
}

message ListPriceChecksResponse {
  repeated PriceCheckSummary checks = 1;
}

service PricingService {
  // The only call that reaches a model.
  rpc IdentifyItem(IdentifyItemRequest) returns (IdentifyItemResponse);

  // Recording, not pricing — see the request.
  rpc CompletePriceCheck(CompletePriceCheckRequest) returns (CompletePriceCheckResponse);

  // The asked question.
  rpc SubmitPriceCheckFeedback(SubmitPriceCheckFeedbackRequest) returns (SubmitPriceCheckFeedbackResponse);

  // The unasked one, and the better of the two. Copying is what somebody does
  // immediately before pasting into Facebook: it is captured on nearly every
  // successful run, where a prompt is answered by the minority who feel
  // strongly enough to stop and tap — which skews negative. Idempotent; the
  // first price copy keeps the timestamp.
  rpc RecordPriceCheckCopy(RecordPriceCheckCopyRequest) returns (RecordPriceCheckCopyResponse);

  // Reads the rows back. Costs nothing and calls nothing — the row was written
  // either way.
  rpc ListPriceChecks(ListPriceChecksRequest) returns (ListPriceChecksResponse);
}
